name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  tag-release:
    name: Tag and Release
    runs-on: ubuntu-latest
    outputs:
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm clean-install

      - name: Verify the integrity of provenance attestations and registry signatures
        run: npm audit signatures

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GIT_APP_OP_APP_ID }}
          private-key: ${{ secrets.GIT_APP_OP_PRIVATE_KEY }}
          owner: ${{ vars.GIT_APP_OP_OWNER }}

      - name: Release
        id: semantic
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
          GITHUB_TOKEN: "${{ steps.app-token.outputs.token }}"
        run: |
          npx semantic-release

          VERSION=$(git describe --tags --abbrev=0)
          echo "new_release_version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Debug Release Output
        run: |
          echo "Checking semantic-release output..."
          echo "Step outputs: ${{ steps.semantic.outputs.new_release_version }}"

  push-container:
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    needs: tag-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.tag-release.outputs.new_release_version }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.tag-release.outputs.new_release_version }}
            ghcr.io/${{ github.repository }}:latest
